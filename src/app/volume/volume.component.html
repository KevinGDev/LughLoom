<div class="volume-container">
  {{"musicVolume"| translate}}
  <input
    type="range"
    min="0"
    max="1"
    step="0.01"
    class="volume-slider"
    [value]="audio.musicVolume"
    (input)="onSliderMusicChange($event)"
  />

  <span class="percent">
    {{ audio.musicVolume * 100 | number:'1.0-0' }}%
  </span>

  {{"sfxVolume"| translate}}

  <input
    type="range"
    min="0"
    max="1"
    step="0.01"
    class="volume-slider"
    [value]="audio.sfxVolume"
    (input)="onSliderSfxChange($event)"
  />

  <span class="percent">
    {{ audio.sfxVolume * 100 | number:'1.0-0' }}%
  </span>
</div>
